<!DOCTYPE html>
<html lang="vi" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="theme-color" content="#f8f9fc">
    <meta name="description" content="Thông báo về quyền riêng tư và bảo mật thông tin.">

    <title>Thông báo bảo mật</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <style>
        :root {
            --accent: #f04483;
            --accent-hover: #db326f;
            --page-bg: #f8f9fc;
            --card-bg: #ffffff;
            --card-border: #ececf1;
            --text-main: #252631;
            --text-muted: #777987;
            --surface-bg: #f7f7fa;
            --shadow: 0 8px 35px rgba(20, 20, 40, 0.045);
        }

        [data-bs-theme="dark"] {
            --page-bg: #111216;
            --card-bg: #1a1b21;
            --card-border: #2b2c33;
            --text-main: #f1f1f5;
            --text-muted: #a2a3af;
            --surface-bg: #15161b;
            --shadow: 0 8px 35px rgba(0, 0, 0, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            background: var(--page-bg);
            color: var(--text-main);
            font-family:
                -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.2s ease,
                        color 0.2s ease;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        /* Header */

        .topbar {
            width: 100%;
            padding: 18px 24px;
        }

        .topbar-inner {
            width: 100%;
            max-width: 1040px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.2px;
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            flex: 0 0 36px;
            display: grid;
            place-items: center;
            border: 1px solid var(--card-border);
            border-radius: 11px;
            background: var(--card-bg);
            color: var(--accent);
            font-size: 17px;
        }

        .theme-toggle {
            width: 42px;
            height: 42px;
            flex: 0 0 42px;
            display: grid;
            place-items: center;
            border: 1px solid var(--card-border);
            border-radius: 50%;
            background: var(--card-bg);
            color: var(--text-main);
            font-size: 17px;
            cursor: pointer;
            transition: background 0.2s ease,
                        transform 0.2s ease;
        }

        .theme-toggle:hover {
            transform: translateY(-1px);
        }

        .theme-toggle:focus-visible,
        .btn:focus-visible {
            outline: 3px solid rgba(240, 68, 131, 0.35);
            outline-offset: 3px;
        }

        /* Main */

        .main-content {
            min-height: calc(100vh - 125px);
            min-height: calc(100dvh - 125px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px 45px;
        }

        .notice-card {
            width: 100%;
            max-width: 420px;
            padding: 32px;
            border: 1px solid var(--card-border);
            border-radius: 20px;
            background: var(--card-bg);
            box-shadow: var(--shadow);
        }

        .illustration {
            width: 58px;
            height: 58px;
            margin: 0 auto 20px;
            display: grid;
            place-items: center;
            border-radius: 17px;
            background: rgba(240, 68, 131, 0.09);
            color: var(--accent);
            font-size: 26px;
        }

        .notice-title {
            margin: 0 0 12px;
            font-size: 25px;
            line-height: 1.3;
            font-weight: 750;
            letter-spacing: -0.65px;
            text-align: center;
        }

        .notice-description {
            margin: 0;
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.8;
            text-align: center;
            overflow-wrap: anywhere;
        }

        /* File information */

        .file-info {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 24px;
            padding: 15px;
            border: 1px solid var(--card-border);
            border-radius: 13px;
            background: var(--surface-bg);
        }

        .file-info-icon {
            width: 42px;
            height: 42px;
            flex: 0 0 42px;
            display: grid;
            place-items: center;
            border-radius: 11px;
            background: rgba(240, 68, 131, 0.09);
            color: var(--accent);
            font-size: 21px;
        }

        .file-info-content {
            min-width: 0;
            flex: 1;
        }

        .file-info-title {
            margin-bottom: 4px;
            font-size: 13px;
            font-weight: 650;
            overflow-wrap: anywhere;
        }

        .file-info-subtitle {
            margin: 0;
            color: var(--text-muted);
            font-size: 12px;
            line-height: 1.5;
        }

        .file-info-status {
            flex: 0 0 auto;
            color: var(--text-muted);
            font-size: 17px;
        }

        /* Actions */

        .actions {
            display: grid;
            gap: 10px;
            margin-top: 22px;
        }

        .btn {
            min-height: 48px;
            padding: 12px 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border-radius: 11px;
            font-size: 14px;
            font-weight: 650;
            line-height: 1.4;
            white-space: normal;
            transition: background 0.2s ease,
                        border-color 0.2s ease,
                        transform 0.2s ease;
        }

        .btn-primary-custom {
            border: 1px solid var(--accent);
            background: var(--accent);
            color: #fff;
        }

        .btn-primary-custom:hover {
            border-color: var(--accent-hover);
            background: var(--accent-hover);
            color: #fff;
        }

        .btn-secondary-custom {
            border: 1px solid var(--card-border);
            background: transparent;
            color: var(--text-main);
        }

        .btn-secondary-custom:hover {
            border-color: var(--card-border);
            background: var(--surface-bg);
            color: var(--text-main);
        }

        .privacy-note {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: 6px;
            margin: 20px 0 0;
            color: var(--text-muted);
            font-size: 11px;
            line-height: 1.7;
            text-align: center;
        }

        .privacy-note i {
            margin-top: 2px;
            flex: 0 0 auto;
        }

        /* Footer */

        .footer {
            padding: 0 20px 20px;
            color: var(--text-muted);
            font-size: 11px;
            text-align: center;
        }

        /* Video */

        #player {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            width: 100%;
            height: 100%;
            height: 100dvh;
            background: #000;
        }

        #video {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        /* Mobile */

        @media (max-width: 575.98px) {
            .topbar {
                padding: 14px 16px;
            }

            .brand {
                gap: 8px;
                font-size: 12px;
            }

            .brand-icon {
                width: 34px;
                height: 34px;
                flex-basis: 34px;
            }

            .theme-toggle {
                width: 40px;
                height: 40px;
                flex-basis: 40px;
            }

            .main-content {
                min-height: auto;
                min-height: calc(100dvh - 100px);
                padding: 24px 16px 32px;
            }

            .notice-card {
                max-width: 420px;
                padding: 27px 21px;
                border-radius: 17px;
            }

            .illustration {
                width: 54px;
                height: 54px;
                margin-bottom: 18px;
                border-radius: 15px;
                font-size: 24px;
            }

            .notice-title {
                font-size: 23px;
            }

            .notice-description {
                font-size: 13px;
                line-height: 1.8;
            }

            .file-info {
                margin-top: 21px;
                padding: 13px;
            }

            .btn {
                min-height: 48px;
                font-size: 13px;
            }

            .privacy-note {
                font-size: 10px;
            }
        }

        @media (max-width: 360px) {
            .notice-card {
                padding: 23px 17px;
            }

            .notice-title {
                font-size: 21px;
            }

            .file-info {
                gap: 9px;
            }

            .file-info-title {
                font-size: 12px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header class="topbar">
        <div class="topbar-inner">
            <div class="brand">
                <span class="brand-icon">
                    <i class="bi bi-folder2-open"></i>
                </span>

                <span>MY FILES</span>
            </div>

            <button
                type="button"
                class="theme-toggle"
                id="themeToggle"
                aria-label="Chuyển sang Dark Mode"
                title="Chuyển giao diện"
            >
                <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
            </button>
        </div>
    </header>

    <!-- Main content -->
    <main class="main-content" id="gate">
        <section class="notice-card" aria-labelledby="noticeTitle">

            <div class="illustration">
                <i class="bi bi-file-earmark-text"></i>
            </div>

            <h1 class="notice-title" id="noticeTitle">
                Một chút lưu ý
            </h1>

            <p class="notice-description">
                File có chứa các thông tin nhạy cảm về đối tượng trong
                files. Vui lòng tôn trọng quyền riêng tư và giữ bảo mật
                thông tin nhé.
            </p>

            <!-- File preview -->
            <div class="file-info">
                <div class="file-info-icon">
                    <i class="bi bi-file-earmark"></i>
                </div>

                <div class="file-info-content">
                    <div class="file-info-title">
                        pinkyy.pdf
                    </div>

                    <p class="file-info-subtitle">
                        Nội dung cần được giữ bảo mật
                    </p>
                </div>

                <i class="bi bi-info-circle file-info-status"
                   aria-hidden="true"></i>
            </div>

            <!-- Actions -->
            <div class="actions">
                <button
                    type="button"
                    class="btn btn-primary-custom"
                    id="yesButton"
                >
                    <i class="bi bi-check-circle"></i>
                    Tôi đồng ý giữ bảo mật
                </button>

                <button
                    type="button"
                    class="btn btn-secondary-custom"
                    id="noButton"
                >
                    Để sau
                </button>
            </div>

            <p class="privacy-note">
                <i class="bi bi-shield-check"></i>
                <span>
                    Vui lòng không chia sẻ thông tin khi chưa được phép.
                </span>
            </p>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer" id="pageFooter">
        VHMING.COM &copy; <span id="year"></span>
    </footer>

    <!-- Video player -->
    <div id="player">
        <video id="video" playsinline>
            <source src="./rickroll.mp4" type="video/mp4">
            Trình duyệt của bạn không hỗ trợ video.
        </video>
    </div>

    <!-- Notification -->
    <div
        class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3"
        style="z-index: 2000; width: min(100%, 420px);"
    >
        <div
            id="noticeToast"
            class="toast border-0 rounded-3 w-100"
            role="status"
            aria-live="polite"
            aria-atomic="true"
        >
            <div class="toast-body p-3" id="noticeMessage"></div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const root = document.documentElement;

        const themeToggle = document.getElementById("themeToggle");
        const themeIcon = document.getElementById("themeIcon");

        const gate = document.getElementById("gate");
        const pageFooter = document.getElementById("pageFooter");
        const player = document.getElementById("player");
        const video = document.getElementById("video");

        const yesButton = document.getElementById("yesButton");
        const noButton = document.getElementById("noButton");

        const toastElement = document.getElementById("noticeToast");
        const noticeMessage = document.getElementById("noticeMessage");

        const toast = new bootstrap.Toast(toastElement, {
            delay: 3000
        });

        document.getElementById("year").textContent =
            new Date().getFullYear();

        // Light / Dark Mode
        function setTheme(theme) {
            root.setAttribute("data-bs-theme", theme);

            const isDark = theme === "dark";

            themeIcon.className = isDark
                ? "bi bi-sun-fill"
                : "bi bi-moon-stars-fill";

            themeToggle.setAttribute(
                "aria-label",
                isDark
                    ? "Chuyển sang Light Mode"
                    : "Chuyển sang Dark Mode"
            );

            document
                .querySelector('meta[name="theme-color"]')
                .setAttribute(
                    "content",
                    isDark ? "#111216" : "#f8f9fc"
                );
        }

        function getInitialTheme() {
            try {
                const savedTheme = localStorage.getItem("site-theme");

                if (savedTheme === "light" || savedTheme === "dark") {
                    return savedTheme;
                }
            } catch (error) {
                // Tiếp tục bằng theme hệ thống nếu storage bị chặn.
            }

            return window.matchMedia(
                "(prefers-color-scheme: dark)"
            ).matches ? "dark" : "light";
        }

        setTheme(getInitialTheme());

        themeToggle.addEventListener("click", () => {
            const currentTheme =
                root.getAttribute("data-bs-theme");

            const nextTheme =
                currentTheme === "dark" ? "light" : "dark";

            setTheme(nextTheme);

            try {
                localStorage.setItem("site-theme", nextTheme);
            } catch (error) {
                // Nút chuyển theme vẫn hoạt động bình thường.
            }
        });

        // Toast notification
        function showNotice(message) {
            noticeMessage.textContent = message;
            toast.show();
        }

        // Start video after confirmation
        async function startVideo() {
            gate.style.display = "none";
            pageFooter.style.display = "none";
            player.style.display = "block";

            try {
                if (player.requestFullscreen) {
                    await player.requestFullscreen();
                }
            } catch (error) {
                // Fullscreen có thể không được hỗ trợ.
            }

            try {
                video.currentTime = 0;
                await video.play();
            } catch (error) {
                showNotice(
                    "Không phát được video. Vui lòng kiểm tra file rickroll.mp4."
                );
            }
        }

        yesButton.addEventListener("click", startVideo);

        noButton.addEventListener("click", () => {
            showNotice("Bạn có thể quay lại khi sẵn sàng.");
        });

        // Pause video when fullscreen closes
        document.addEventListener("fullscreenchange", () => {
            if (
                !document.fullscreenElement &&
                !video.ended &&
                !video.paused
            ) {
                video.pause();
            }
        });

        // Restore the page after playback
        video.addEventListener("ended", () => {
            if (document.fullscreenElement) {
                document.exitFullscreen().catch(() => {});
            }

            player.style.display = "none";
            gate.style.display = "";
            pageFooter.style.display = "";
        });

        // Handle missing or invalid video
        video.addEventListener("error", () => {
            if (player.style.display === "block") {
                showNotice(
                    "Không thể tải video. Hãy kiểm tra file rickroll.mp4."
                );
            }
        });
    </script>
</body>
</html>
